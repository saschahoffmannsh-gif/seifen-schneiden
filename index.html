<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#c9ab88" />
  <title>Seifen-Schneiden</title>
  
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Kopfzeile: Münzen -->
  <div id="hud">
    <div id="coins" class="pill">🪙 <span id="coin-count">0</span></div>
  </div>

  <!-- Bestell-Zettel: schmal, unter der Schale (Position per JS: --bowl-bottom) -->
  <div id="order" class="ticket">
    <div id="order-text">…</div>
    <div id="order-progress"></div>
  </div>

  <!-- Schneide-Fortschritt der aktuellen Seife -->
  <div id="cut-progress" class="hidden">
    <div id="cut-label">Geschnitten: 0 %</div>
    <div class="bar"><div id="cut-bar"></div></div>
  </div>

  <!-- Hinweistext / Statuszeile -->
  <div id="hint"></div>

  <!-- Ofen-Fortschritt -->
  <div id="oven" class="panel hidden">
    <div class="panel-title">🔥 Ofen – Seife schmilzt …</div>
    <div class="bar"><div id="oven-bar"></div></div>
  </div>

  <!-- Aktions-Knöpfe -->
  <div id="actions"></div>

  <!-- schwebende Texte ("So satisfying!") -->
  <div id="popups"></div>
  <div id="fps" class="hidden"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
