<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#c9ab88" />
  <title>Seifen-Schneiden</title>
  
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Kopfzeile: Münzen -->
  <div id="hud">
    <div id="coins" class="pill">🪙 <span id="coin-count">0</span></div>
  </div>

  <!-- Bestell-Zettel: schmal, unter der Schale (Position per JS: --bowl-bottom) -->
  <div id="order" class="ticket">
    <div id="order-text">…</div>
    <div id="order-progress"></div>
    <div id="order-deco" class="hidden"></div>
  </div>

  <!-- Schneide-Fortschritt der aktuellen Seife -->
  <div id="cut-progress" class="hidden">
    <div id="cut-label">Geschnitten: 0 %</div>
    <div class="bar"><div id="cut-bar"></div></div>
  </div>

  <!-- Hinweistext / Statuszeile -->
  <div id="hint"></div>

  <!-- Ofen-Fortschritt -->
  <div id="oven" class="panel hidden">
    <div class="panel-title">🔥 Ofen – Seife schmilzt …</div>
    <div class="bar"><div id="oven-bar"></div></div>
  </div>

  <!-- Päckchen-Auswahl (öffnet sich beim Antippen eines Päckchens im Regal) -->
  <div id="pkg-picker">
    <div class="sheet panel">
      <button id="pkg-close" aria-label="Schließen">✕</button>
      <div class="panel-title" id="pkg-title">Päckchen wählen</div>
      <div id="pkg-tabs" class="scroll-x"></div>
      <div id="pkg-list" class="scroll-x"></div>
      <div id="pkg-note">Noch gesperrt</div>
    </div>
  </div>

  <!-- Ergebnis nach dem Ausformen: wie genau war die Mischung -->
  <div id="quality">
    <div id="q-stars">★★★</div>
    <div id="q-title"></div>
    <div id="q-rows"></div>
  </div>

  <!-- Bestell-Zettel groß (öffnet sich beim Antippen eines Zettels am mittleren Brett) -->
  <div id="note-view">
    <div class="big-note">
      <div class="tape"></div>
      <button id="note-close" class="x-btn" aria-label="Schließen">✕</button>
      <div class="note-head">Bestellung</div>
      <div id="note-customer"></div>
      <div id="note-soaps"></div>
      <div id="note-reward"></div>
      <button id="note-accept" class="btn">Annehmen</button>
    </div>
  </div>

  <!-- Seifenschrank im Vollbild: Türen gehen auf, dahinter viele kleine Schubladen -->
  <div id="cabinet">
    <div class="cab">
      <div class="cab-top">
        <div class="cab-title">Seifenschrank</div>
        <button id="cab-close" class="x-btn" aria-label="Schließen">✕</button>
      </div>
      <div id="cab-find"></div>
      <div id="cab-grid" class="scroll-y"></div>
      <div id="cab-msg"></div>
      <div class="cab-door left"><span class="knob"></span></div>
      <div class="cab-door right"><span class="knob"></span></div>
    </div>
  </div>

  <!-- Freischalten (Päckchen und Deko) -->
  <div id="unlock">
    <div class="unlock-card">
      <button id="unlock-close" class="x-btn" aria-label="Schließen">✕</button>
      <img id="unlock-img" alt="">
      <div id="unlock-name"></div>
      <div id="unlock-bonus"></div>
      <div id="unlock-have"></div>
      <button id="unlock-buy" class="btn alt">Freischalten</button>
    </div>
  </div>

  <!-- Aktions-Knöpfe -->
  <div id="actions"></div>

  <!-- schwebende Texte ("So satisfying!") -->
  <div id="popups"></div>
  <div id="fps" class="hidden"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
